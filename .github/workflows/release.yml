name: DGSM Versioned Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/v*.*.*'

permissions:
  contents: write

jobs:
  verify-source:
    name: Verify tagged source and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify tag matches canonical project version
        shell: bash
        run: |
          version="$(python -c 'from dgsm_version import __version__; print(__version__)')"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_ref="${expected_tag}"
          else
            expected_ref="release/${expected_tag}"
          fi
          if [[ "${GITHUB_REF_NAME}" != "${expected_ref}" ]]; then
            echo "Ref ${GITHUB_REF_NAME} does not match canonical release ref ${expected_ref}." >&2
            exit 1
          fi
          echo "Verified release ref ${GITHUB_REF_NAME} -> ${expected_tag}"
      - name: Install pip-audit from PyPI
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --index-url https://pypi.org/simple pip-audit
      - name: Audit build and optional runtime dependencies
        run: >-
          pip-audit --strict
          -r requirements-build.txt
          -r requirements-optional.txt
      - name: Compile modules and run regression tests
        run: |
          python -m py_compile discord_server_global_status.py backends/http_transport.py backends/ripe_atlas.py discord_monitor_dll_build.py embed_windows_resources.py
          python -m unittest -v test_discord_server_global_status.py

  windows-release:
    name: Build and sign Windows EXE/DLL
    needs: verify-source
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Validate PowerShell build and signing scripts
        shell: pwsh
        run: |
          $scripts = @('build_windows.ps1', 'sign_windows.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
      - name: Build, sign and verify Windows artifacts
        shell: pwsh
        env:
          DGSM_PFX_BASE64: ${{ secrets.DGSM_PFX_BASE64 }}
          DGSM_PFX_PASSWORD: ${{ secrets.DGSM_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'dgsm-publisher.pfx'
          try {
            if (-not [string]::IsNullOrWhiteSpace($env:DGSM_PFX_BASE64)) {
              if ([string]::IsNullOrWhiteSpace($env:DGSM_PFX_PASSWORD)) {
                throw 'DGSM_PFX_PASSWORD must be configured when DGSM_PFX_BASE64 is configured.'
              }
              $bytes = [Convert]::FromBase64String($env:DGSM_PFX_BASE64)
              [IO.File]::WriteAllBytes($pfxPath, $bytes)
              $env:DGSM_PFX_PATH = $pfxPath
              Write-Host 'Using the configured CA-issued publisher PFX.'
            } else {
              Write-Warning 'No publisher PFX configured; Windows artifacts will use the ephemeral self-signed development certificate.'
            }

            .\build_windows.ps1 -NoToolchainInstall

            $required = @(
              'dist\windows\exe\DiscordGlobalStatusMonitor.exe',
              'dist\windows\dll\discord_global_status.dll',
              'dist\windows\DiscordGlobalStatusMonitor-Windows-x64.zip',
              'dist\windows\DiscordGlobalStatusMonitor-Windows-x64.zip.sha256',
              'dist\windows\signing\signing-report.txt'
            )
            foreach ($path in $required) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Required signed release artifact is missing: $path"
              }
            }

            foreach ($path in @(
              'dist\windows\exe\DiscordGlobalStatusMonitor.exe',
              'dist\windows\dll\discord_global_status.dll'
            )) {
              $signature = Get-AuthenticodeSignature -FilePath $path
              if ($signature.Status -ne 'Valid') {
                throw "Authenticode signature is not valid for $path : $($signature.Status)"
              }
            }
          } finally {
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force
            }
            Remove-Item Env:\DGSM_PFX_PATH -ErrorAction SilentlyContinue
          }
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: DGSM-Windows-x64-release
          path: |
            dist/windows/exe/DiscordGlobalStatusMonitor.exe
            dist/windows/dll/discord_global_status.dll
            dist/windows/DiscordGlobalStatusMonitor-Windows-x64.zip
            dist/windows/DiscordGlobalStatusMonitor-Windows-x64.zip.sha256
            dist/windows/signing/signing-report.txt
            dist/windows/signing/DGSM-Development-CodeSigning.cer
          if-no-files-found: warn

  linux-release:
    name: Build and sign Linux zipapp/C ABI artifacts
    needs: verify-source
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check shell syntax
        run: bash -n build_linux.sh sign_linux.sh RUN_DISCORD_STATUS.sh
      - name: Create ephemeral signing passphrase
        shell: bash
        run: echo "DGSM_SIGN_PASSPHRASE=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build, sign and verify Linux artifacts
        run: bash ./build_linux.sh
      - name: Upload Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: DGSM-Linux-x64-release
          path: |
            dist/linux/DiscordGlobalStatusMonitor.pyz
            dist/linux/DiscordGlobalStatusMonitor.pyz.sig
            dist/linux/discord_global_status.so
            dist/linux/discord_global_status.so.sig
            dist/linux/discord_global_status.h
            dist/linux/BUILD_ABI.txt
            dist/linux/SHA256SUMS.txt
            dist/linux/DGSM-Development-CodeSigning-Certificate.pem
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [verify-source, windows-release, linux-release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: DGSM-Windows-x64-release
          path: release-assets/windows
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: DGSM-Linux-x64-release
          path: release-assets/linux
      - name: Package Linux archive and checksums
        shell: bash
        run: |
          tar -czf release-assets/linux/DGSM-Linux-x64.tar.gz \
            -C release-assets/linux \
            DiscordGlobalStatusMonitor.pyz DiscordGlobalStatusMonitor.pyz.sig \
            discord_global_status.so discord_global_status.so.sig \
            discord_global_status.h BUILD_ABI.txt SHA256SUMS.txt \
            DGSM-Development-CodeSigning-Certificate.pem
          (cd release-assets && find windows linux -type f ! -name SHA256SUMS-RELEASE.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS-RELEASE.txt)
      - name: Publish versioned release and verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python -c 'from dgsm_version import __version__; print(__version__)')"
          tag="v${version}"
          mapfile -d '' -t assets < <(find release-assets/windows -type f -print0 | sort -z)
          assets+=( "release-assets/linux/DGSM-Linux-x64.tar.gz" )
          assets+=( "release-assets/SHA256SUMS-RELEASE.txt" )
          assets+=( "Discord_Global_Status_Monitor_v${version}_RELEASE_NOTES.txt" )

          if [[ "${#assets[@]}" -lt 4 ]]; then
            echo "Release asset collection is incomplete." >&2
            exit 1
          fi
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "DGSM ${version}" \
            --notes-file "Discord_Global_Status_Monitor_v${version}_RELEASE_NOTES.txt" \
            "${assets[@]}"
