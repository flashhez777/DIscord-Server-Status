name: DGSM CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A push and pull_request event for the same feature branch validate one exact
# head at a time. A newer head supersedes pending/older runs to avoid building
# stale commits and starving the release pipeline of hosted runner capacity.
concurrency:
  group: dgsm-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python modules
        run: >-
          python -m py_compile discord_server_global_status.py
          backends/http_transport.py backends/ripe_atlas.py
          discord_monitor_dll_build.py embed_windows_resources.py
      - name: Run offline regression suite
        run: python -m unittest -v test_discord_server_global_status.py
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .

  security-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pip-audit from PyPI
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --index-url https://pypi.org/simple pip-audit
      - name: Audit build and optional runtime dependencies
        run: >-
          pip-audit --strict
          -r requirements-build.txt
          -r requirements-optional.txt

  linux-build:
    name: Build Linux zipapp and C ABI library
    needs: [tests, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check shell syntax
        run: bash -n build_linux.sh sign_linux.sh RUN_DISCORD_STATUS.sh
      - name: Build Linux artifacts
        env:
          DGSM_SKIP_SIGNING: '1'
        run: bash ./build_linux.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DGSM-Linux-x64-unsigned-CI
          path: |
            dist/linux/DiscordGlobalStatusMonitor.pyz
            dist/linux/discord_global_status.so
            dist/linux/discord_global_status.h
            dist/linux/dgsm_version.py
            dist/linux/BUILD_ABI.txt
            dist/linux/backends/*.py
            dist/linux/discord_server_global_status.py
            dist/linux/LICENSE
            dist/linux/Discord_Global_Status_Monitor_v3.4.5_RELEASE_NOTES.txt
          if-no-files-found: error

  windows-build:
    name: Build and development-sign Windows EXE and DLL
    needs: [tests, security-audit]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Parse PowerShell build and signing scripts
        shell: pwsh
        run: |
          $scripts = @('build_windows.ps1', 'sign_windows.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "PowerShell syntax: PASS - $script"
          }
      - name: Build, development-sign, and verify Windows artifacts
        timeout-minutes: 30
        shell: powershell
        run: .\build_windows.ps1 -NoToolchainInstall
      - name: Upload Windows development-signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DGSM-Windows-x64-development-signed-CI
          path: |
            dist/windows/exe/DiscordGlobalStatusMonitor.exe
            dist/windows/dll/discord_global_status.dll
            dist/windows/dll/discord_global_status.h
            dist/windows/dll/discord_server_global_status.py
            dist/windows/dll/dgsm_version.py
            dist/windows/dll/backends/*.py
            dist/windows/DiscordGlobalStatusMonitor-Windows-x64.zip
            dist/windows/DiscordGlobalStatusMonitor-Windows-x64.zip.sha256
            dist/windows/signing/signing-report.txt
            dist/windows/signing/DGSM-Development-CodeSigning.cer
          if-no-files-found: error
