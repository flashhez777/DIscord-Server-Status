name: DGSM CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python modules
        run: >-
          python -m py_compile discord_server_global_status.py
          backends/ripe_atlas.py discord_monitor_dll_build.py
          embed_windows_resources.py
      - name: Run offline regression suite
        run: python -m unittest -v test_discord_server_global_status.py
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .

  linux-build:
    name: Build Linux zipapp and C ABI library
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check shell syntax
        run: bash -n build_linux.sh sign_linux.sh RUN_DISCORD_STATUS.sh
      - name: Build Linux artifacts
        env:
          DGSM_SKIP_SIGNING: '1'
        run: bash ./build_linux.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DGSM-Linux-x64
          path: |
            dist/linux/DiscordGlobalStatusMonitor.pyz
            dist/linux/discord_global_status.so
            dist/linux/discord_global_status.h
            dist/linux/dgsm_version.py
            dist/linux/BUILD_ABI.txt
            dist/linux/backends/*.py
            dist/linux/discord_server_global_status.py
            dist/linux/LICENSE
            dist/linux/Discord_Global_Status_Monitor_v3.4.4_RELEASE_NOTES.txt
          if-no-files-found: error

  windows-build:
    name: Build Windows EXE and DLL (unsigned CI artifacts)
    needs: tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Parse PowerShell build and signing scripts
        shell: pwsh
        run: |
          $scripts = @('build_windows.ps1', 'sign_windows.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "PowerShell syntax: PASS - $script"
          }
      - name: Build native Windows artifacts
        shell: powershell
        run: .\build_windows.ps1 -NoToolchainInstall -SkipSigning
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DGSM-Windows-x64-unsigned-CI
          path: |
            dist/windows/exe/DiscordGlobalStatusMonitor.exe
            dist/windows/dll/discord_global_status.dll
            dist/windows/dll/discord_global_status.h
            dist/windows/dll/discord_server_global_status.py
            dist/windows/dll/dgsm_version.py
            dist/windows/dll/backends/*.py
            dist/windows/DiscordGlobalStatusMonitor-Windows-x64.zip
            dist/windows/DiscordGlobalStatusMonitor-Windows-x64.zip.sha256
          if-no-files-found: error
